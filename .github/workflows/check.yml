name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Offline application contracts
        env:
          GEMINI_API_KEY: ''
        run: python -m pytest tests/test_answer_presentation.py tests/test_api_health.py tests/test_query_jobs.py tests/test_terminology_preserver.py -q
